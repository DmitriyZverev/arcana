[workspace]
members = [".", "xtask"]
resolver = "2"

[package]
name = "arkana"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/DmitriyZverev/arkana"
rust-version = "1.88.0"
description = "A modern CLI tool for password-based encryption with human-readable output"

[features]
deterministic = []

[lints.rust]
unreachable_pub = "deny"

[dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
bstr = "1.12.1"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
ciborium = "0.2.2"
clap = { version = "4.5.60", features = ["derive"] }
crossterm = "0.29.0"
data-encoding = "2.10.0"
image = "0.25.10"
path-absolutize = "3.1.1"
pathdiff = "0.2.3"
qrcode = "0.14.1"
rxing = { version = "0.8.5", default-features = false, features = ["encoding_rs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tar = "0.4.45"
thiserror = "2.0.18"
zeroize = "1.8.2"

[dev-dependencies]
indoc = "2.0.7"
pretty_assertions = "1.4.1"
tempfile = "3.26.0"

[target."cfg(unix)".dependencies]
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
